<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#390038">
  <meta name="description" content="Для моего солнышка — с любовью.">
  <title>Happy Day My Love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css?v=10">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="sparkles" aria-hidden="true"></div>
  <main class="app-shell">
    <section class="scene" id="scene" aria-live="polite">
      <div class="content" id="content">
        <h1 id="title">Моё<br>солнышко</h1>
        <div class="title-heart" aria-hidden="true">♡</div>
        <p class="eyebrow" id="eyebrow">До твоего<br>особенного дня<br>осталось</p>
        <div class="countdown" id="countdown" aria-label="Обратный отсчёт">
          <div class="time-unit"><strong id="days">--</strong><span>ДНЕЙ</span></div>
          <div class="time-unit"><strong id="hours">--</strong><span>ЧАСА</span></div>
          <div class="time-unit"><strong id="minutes">--</strong><span>МИНУТ</span></div>
          <div class="time-unit"><strong id="seconds">--</strong><span>СЕКУНД</span></div>
        </div>
        <div class="ornament-divider" aria-hidden="true"><i></i><b>♥</b><i></i></div>
        <p class="body" id="body">С каждым днём<br>я всё больше понимаю,<br>как мне повезло, что ты есть<br>в моей жизни <span class="pink-heart">♥</span></p>
        <p class="hint" id="hint">До твоего особенного дня · 30 октября</p>
        <button class="primary-button" id="next" type="button">Открыть сюрприз <span>♡</span></button>
        <button class="text-button" id="back" type="button" hidden>← Вернуться к отсчёту</button>
        <div class="letter-stage" id="letter-stage" hidden aria-label="Конверт с письмом"><div class="envelope" id="envelope"><div class="envelope-back"></div><div class="letter-paper"><span>Моему солнышку</span><b>♥</b></div><div class="envelope-front"></div><div class="envelope-flap"></div><span class="wax-seal">♥</span></div><p class="envelope-caption">Для тебя — от всего сердца</p></div>
        <div class="progress" id="progress" hidden><span id="progress-fill"></span></div>
        <p class="signature" id="signature">С любовью, для тебя <span>♥</span></p>
        <p class="chapter-counter" id="counter">30 · 10 · 2026</p>
      </div>
    </section>
  </main>
  <script src="./assets/js/app.js?v=10" defer></script>
</body>
</html>
